<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Book Reader</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <!-- PageFlip Library -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #0d0f12;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header Navbar */
    header {
      width: 100%;
      padding: 12px 20px;
      background: #14171d;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.25s ease;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .btn-back:hover {
      background: #ffffff;
      color: #0d0f12;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
    }

    /* Group Control Buttons (Zoom & Prev/Next) */
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 4px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover {
      background: #ffffff;
      color: #0d0f12;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }

    /* Viewer Area */
    #viewer-container {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Outer Wrapper untuk Fitur Zoom Smooth & Drag */
    #zoom-viewport {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center center;
      transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: grab;
    }

    #zoom-viewport:active {
      cursor: grabbing;
    }

    #flipbook {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 255, 255, 0.08);
      margin-top: -15px; /* Menaikkan posisi buku */
    }

    .page-wrapper {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .page-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Loader Per Halaman */
    .page-loader {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      height: 100%;
      width: 100%;
      color: #64748b;
      font-weight: 600;
      font-size: 0.85rem;
      background-color: #f8fafc;
    }

    .page-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #cbd5e1;
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Loading Main Overlay */
    .loading-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 23, 29, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
      padding: 20px 36px;
      border-radius: 12px;
      text-align: center;
      z-index: 50;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header>
    <div class="brand-section">
      <a href="index.html" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i> Home
      </a>
    </div>

    <div class="controls">
      <!-- Tombol Zoom -->
      <button class="nav-btn" id="zoom-in-btn" title="Zoom In">
        <i class="fa-solid fa-magnifying-glass-plus"></i>
      </button>
      <button class="nav-btn" id="zoom-out-btn" title="Zoom Out">
        <i class="fa-solid fa-magnifying-glass-minus"></i>
      </button>
      <button class="nav-btn" id="zoom-reset-btn" title="Reset Zoom">
        <i class="fa-solid fa-rotate-right"></i>
      </button>

      <div class="btn-divider"></div>

      <!-- Tombol Balik Halaman -->
      <button class="nav-btn" id="prev-page-btn" title="Sebelumnya">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <button class="nav-btn" id="next-page-btn" title="Selanjutnya">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </header>

  <!-- Reader Canvas / Viewport -->
  <div id="viewer-container">
    <div id="loading-box" class="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-status">Menyiapkan Buku...</div>
    </div>

    <div id="zoom-viewport">
      <div id="flipbook"></div>
    </div>
  </div>

  <script>
    const PDF_URL = 'book.pdf';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pageFlipInstance = null;
    let pdfDoc = null;
    const renderedPages = new Set();

    // Zoom & Pan Variables
    let currentScale = 1;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let isDragging = false;
    const zoomViewport = document.getElementById('zoom-viewport');
    const viewerContainer = document.getElementById('viewer-container');

    function updateTransform() {
      zoomViewport.style.transform = `translate(${pointX}px, ${pointY}px) scale(${currentScale})`;
    }

    // Load PDF Document
    async function loadPDFBook() {
      const loadingBox = document.getElementById('loading-box');
      const container = document.getElementById('flipbook');
      const loadingStatus = document.getElementById('loading-status');

      try {
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
        const totalPages = pdfDoc.numPages;

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          const pageDiv = document.createElement('div');
          pageDiv.className = 'page-wrapper';
          pageDiv.dataset.pageNum = pageNum;
          
          pageDiv.innerHTML = `
            <div class="page-loader">
              <div class="page-spinner"></div>
            </div>
          `;
          container.appendChild(pageDiv);
        }

        pageFlipInstance = new St.PageFlip(container, {
          width: 450,
          height: 600,
          size: "fixed",
          minWidth: 300,
          maxWidth: 900,
          minHeight: 400,
          maxHeight: 1200,
          maxShadowOpacity: 0.6,
          showCover: true,
          mobileScrollSupport: false
        });

        pageFlipInstance.loadFromHTML(document.querySelectorAll('.page-wrapper'));

        await renderSinglePage(1);
        if (totalPages > 1) await renderSinglePage(2);

        loadingBox.style.display = 'none';

        pageFlipInstance.on('flip', (e) => {
          const currentPage = e.data + 1;
          const pagesToRender = [currentPage - 1, currentPage, currentPage + 1, currentPage + 2];
          for (const p of pagesToRender) {
            if (p >= 1 && p <= totalPages) {
              renderSinglePage(p);
            }
          }
        });

      } catch (error) {
        loadingStatus.innerText = "Gagal memuat file 'book.pdf'.";
        console.error(error);
      }
    }

    async function renderSinglePage(pageNum) {
      if (renderedPages.has(pageNum)) return;
      renderedPages.add(pageNum);

      try {
        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: 1.4 });
        
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: context, viewport: viewport }).promise;

        const imgUrl = canvas.toDataURL('image/png');
        const pageWrappers = document.querySelectorAll('.page-wrapper');
        const targetWrapper = pageWrappers[pageNum - 1];

        if (targetWrapper) {
          targetWrapper.innerHTML = `<img src="${imgUrl}" alt="Halaman ${pageNum}">`;
        }

        canvas.width = 0;
        canvas.height = 0;
      } catch (err) {
        console.error(`Gagal render p.${pageNum}:`, err);
      }
    }

    // Controls: Navigasi
    document.getElementById('prev-page-btn').addEventListener('click', () => {
      if (pageFlipInstance) pageFlipInstance.flipPrev();
    });

    document.getElementById('next-page-btn').addEventListener('click', () => {
      if (pageFlipInstance) pageFlipInstance.flipNext();
    });

    // Controls: Zooming System
    document.getElementById('zoom-in-btn').addEventListener('click', () => {
      if (currentScale < 2.5) {
        currentScale += 0.25;
        updateTransform();
      }
    });

    document.getElementById('zoom-out-btn').addEventListener('click', () => {
      if (currentScale > 0.75) {
        currentScale -= 0.25;
        if (currentScale === 1) {
          pointX = 0;
          pointY = 0;
        }
        updateTransform();
      }
    });

    document.getElementById('zoom-reset-btn').addEventListener('click', () => {
      currentScale = 1;
      pointX = 0;
      pointY = 0;
      updateTransform();
    });

    // Touch / Mouse Dragging saat Zoom
    viewerContainer.addEventListener('mousedown', (e) => {
      if (currentScale > 1) {
        isDragging = true;
        startX = e.clientX - pointX;
        startY = e.clientY - pointY;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      e.preventDefault();
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    window.addEventListener('DOMContentLoaded', loadPDFBook);
  </script>
</body>
</html>
