<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKI Digital Book Reader</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #080a0c;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header Navbar */
    header {
      width: 100%;
      padding: 10px 16px;
      background: rgba(20, 23, 29, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .brand-section {
      display: flex;
      align-items: center;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.25s ease;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
    }

    .btn-back:hover {
      background: #ffffff;
      color: #0d0f12;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 2px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover {
      background: #ffffff;
      color: #0d0f12;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    /* Viewer Container dengan Background Dynamic Glowing Grid */
    #viewer-container {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      background: 
        radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.05) 0%, transparent 60%),
        radial-gradient(circle at 20% 80%, rgba(147, 51, 234, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
        #0b0e14;
      touch-action: none;
    }

    #zoom-viewport {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center center;
      transition: transform 0.15s ease-out;
      cursor: grab;
    }

    #zoom-viewport:active {
      cursor: grabbing;
    }

    #flipbook {
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 255, 255, 0.1);
    }

    .page-wrapper {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .page-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Overlay Tombol Geser (D-Pad Control) saat Zoom In */
    .pan-overlay {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: grid;
      grid-template-columns: repeat(3, 36px);
      grid-template-rows: repeat(3, 36px);
      gap: 4px;
      background: rgba(15, 20, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .pan-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .pan-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.8rem;
    }

    .pan-btn:hover {
      background: #ffffff;
      color: #0b0e14;
    }

    .pan-up { grid-column: 2; grid-row: 1; }
    .pan-left { grid-column: 1; grid-row: 2; }
    .pan-reset { grid-column: 2; grid-row: 2; font-size: 0.7rem; }
    .pan-right { grid-column: 3; grid-row: 2; }
    .pan-down { grid-column: 2; grid-row: 3; }

    /* Page & Main Loader */
    .page-loader {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      width: 100%;
      background-color: #f8fafc;
    }

    .page-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #cbd5e1;
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 23, 29, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
      padding: 20px 36px;
      border-radius: 12px;
      text-align: center;
      z-index: 99;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-section">
      <a href="index.html" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i> Home
      </a>
    </div>

    <div class="controls">
      <button class="nav-btn" id="zoom-in-btn" title="Zoom In"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
      <button class="nav-btn" id="zoom-out-btn" title="Zoom Out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
      <button class="nav-btn" id="zoom-reset-btn" title="Reset Zoom"><i class="fa-solid fa-rotate-right"></i></button>

      <div class="btn-divider"></div>

      <button class="nav-btn" id="prev-page-btn" title="Sebelumnya"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="nav-btn" id="next-page-btn" title="Selanjutnya"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </header>

  <div id="viewer-container">
    <div id="loading-box" class="loading-overlay">
      <div class="spinner"></div>
      <div id="loading-status">Menyiapkan Buku...</div>
    </div>

    <div id="zoom-viewport">
      <div id="flipbook"></div>
    </div>

    <!-- D-Pad Direction Control saat Zooming -->
    <div class="pan-overlay" id="pan-overlay">
      <button class="pan-btn pan-up" id="pan-up-btn"><i class="fa-solid fa-chevron-up"></i></button>
      <button class="pan-btn pan-left" id="pan-left-btn"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="pan-btn pan-reset" id="pan-center-btn"><i class="fa-solid fa-compress"></i></button>
      <button class="pan-btn pan-right" id="pan-right-btn"><i class="fa-solid fa-chevron-right"></i></button>
      <button class="pan-btn pan-down" id="pan-down-btn"><i class="fa-solid fa-chevron-down"></i></button>
    </div>
  </div>

  <script>
    const PDF_URL = 'book.pdf';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pageFlipInstance = null;
    let pdfDoc = null;
    const renderedPages = new Set();

    let currentScale = 1;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let isDragging = false;

    const zoomViewport = document.getElementById('zoom-viewport');
    const viewerContainer = document.getElementById('viewer-container');
    const panOverlay = document.getElementById('pan-overlay');

    function updateTransform() {
      zoomViewport.style.transform = `translate(${pointX}px, ${pointY}px) scale(${currentScale})`;
      if (currentScale > 1) {
        panOverlay.classList.add('active');
      } else {
        panOverlay.classList.remove('active');
      }
    }

    async function loadPDFBook() {
      const loadingBox = document.getElementById('loading-box');
      const container = document.getElementById('flipbook');
      const loadingStatus = document.getElementById('loading-status');

      try {
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
        const totalPages = pdfDoc.numPages;

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          const pageDiv = document.createElement('div');
          pageDiv.className = 'page-wrapper';
          pageDiv.dataset.pageNum = pageNum;
          pageDiv.innerHTML = `<div class="page-loader"><div class="page-spinner"></div></div>`;
          container.appendChild(pageDiv);
        }

        pageFlipInstance = new St.PageFlip(container, {
          width: 450,
          height: 600,
          size: "fixed",
          minWidth: 300,
          maxWidth: 900,
          minHeight: 400,
          maxHeight: 1200,
          maxShadowOpacity: 0.6,
          showCover: true,
          mobileScrollSupport: false
        });

        pageFlipInstance.loadFromHTML(document.querySelectorAll('.page-wrapper'));

        await renderSinglePage(1);
        if (totalPages > 1) await renderSinglePage(2);

        loadingBox.style.display = 'none';

        pageFlipInstance.on('flip', (e) => {
          const currentPage = e.data + 1;
          const pagesToRender = [currentPage - 1, currentPage, currentPage + 1, currentPage + 2];
          for (const p of pagesToRender) {
            if (p >= 1 && p <= totalPages) renderSinglePage(p);
          }
        });

      } catch (error) {
        loadingStatus.innerText = "Gagal memuat 'book.pdf'.";
        console.error(error);
      }
    }

    async function renderSinglePage(pageNum) {
      if (renderedPages.has(pageNum)) return;
      renderedPages.add(pageNum);

      try {
        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: 1.4 });
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: context, viewport: viewport }).promise;

        const imgUrl = canvas.toDataURL('image/png');
        const pageWrappers = document.querySelectorAll('.page-wrapper');
        const targetWrapper = pageWrappers[pageNum - 1];

        if (targetWrapper) {
          targetWrapper.innerHTML = `<img src="${imgUrl}" alt="Halaman ${pageNum}">`;
        }

        canvas.width = 0;
        canvas.height = 0;
      } catch (err) {
        console.error(`Gagal render p.${pageNum}:`, err);
      }
    }

    // Prev / Next Button
    document.getElementById('prev-page-btn').addEventListener('click', () => {
      if (pageFlipInstance) pageFlipInstance.flipPrev();
    });

    document.getElementById('next-page-btn').addEventListener('click', () => {
      if (pageFlipInstance) pageFlipInstance.flipNext();
    });

    // Zoom Controls
    document.getElementById('zoom-in-btn').addEventListener('click', () => {
      if (currentScale < 3) {
        currentScale += 0.3;
        updateTransform();
      }
    });

    document.getElementById('zoom-out-btn').addEventListener('click', () => {
      if (currentScale > 0.8) {
        currentScale -= 0.3;
        if (currentScale <= 1) {
          pointX = 0;
          pointY = 0;
        }
        updateTransform();
      }
    });

    document.getElementById('zoom-reset-btn').addEventListener('click', () => {
      currentScale = 1;
      pointX = 0;
      pointY = 0;
      updateTransform();
    });

    // D-Pad Directional Controls (Kiri, Kanan, Atas, Bawah)
    const PAN_STEP = 50;
    document.getElementById('pan-up-btn').addEventListener('click', () => { pointY += PAN_STEP; updateTransform(); });
    document.getElementById('pan-down-btn').addEventListener('click', () => { pointY -= PAN_STEP; updateTransform(); });
    document.getElementById('pan-left-btn').addEventListener('click', () => { pointX += PAN_STEP; updateTransform(); });
    document.getElementById('pan-right-btn').addEventListener('click', () => { pointX -= PAN_STEP; updateTransform(); });
    document.getElementById('pan-center-btn').addEventListener('click', () => { pointX = 0; pointY = 0; updateTransform(); });

    // Touch & Mouse Dragging (Geser Layar Langsung pakai Jari/Mouse)
    const handleStart = (clientX, clientY) => {
      if (currentScale > 1) {
        isDragging = true;
        startX = clientX - pointX;
        startY = clientY - pointY;
      }
    };

    const handleMove = (clientX, clientY) => {
      if (!isDragging) return;
      pointX = clientX - startX;
      pointY = clientY - startY;
      updateTransform();
    };

    const handleEnd = () => {
      isDragging = false;
    };

    // Mouse Events
    viewerContainer.addEventListener('mousedown', (e) => handleStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', handleEnd);

    // Touch Events (Khusus HP / Layar Sentuh)
    viewerContainer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) handleStart(e.touches[0].clientX, e.touches[0].clientY);
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        handleMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    });

    window.addEventListener('touchend', handleEnd);

    window.addEventListener('DOMContentLoaded', loadPDFBook);
  </script>
</body>
</html>
