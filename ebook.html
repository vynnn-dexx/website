<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital E-Book Reader</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <!-- PageFlip Library (Animasi Balik Halaman 3D) -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #0d0f12;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header Navbar */
    header {
      width: 100%;
      padding: 14px 24px;
      background: #14171d;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Tombol Kembali ke Index */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.25s ease;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .btn-back:hover {
      background: #ffffff;
      color: #0d0f12;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    h1.title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    /* Controls Bar */
    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: #ffffff;
      color: #0d0f12;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }

    .page-indicator {
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    /* Viewer Container */
    #viewer-container {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px 15px 30px 15px;
      position: relative;
    }

    #flipbook {
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.12), 0 20px 40px rgba(0, 0, 0, 0.8);
      margin-top: -10px;
    }

    .page-wrapper {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .page-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Loader Tampilan Per Halaman */
    .page-loader {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      height: 100%;
      width: 100%;
      color: #475569;
      font-weight: 600;
      font-size: 0.85rem;
      background-color: #f8fafc;
    }

    .page-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #cbd5e1;
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Loading Overlay Awal */
    .loading-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 23, 29, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
      padding: 24px 40px;
      border-radius: 12px;
      text-align: center;
      z-index: 50;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px auto;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-weight: 600;
      color: #ffffff;
      font-size: 0.95rem;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="brand-section">
      <a href="index.html" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i> Home
      </a>
      <h1 class="title"><i class="fa-solid fa-book-open"></i> E-Book Reader</h1>
    </div>

    <div class="controls">
      <button class="nav-btn" id="prev-page-btn" title="Kembali">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <span class="page-indicator" id="page-counter">0 / 0</span>
      <button class="nav-btn" id="next-page-btn" title="Maju">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </header>

  <!-- Container Reader -->
  <div id="viewer-container">
    <div id="loading-box" class="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-status">Menyiapkan E-Book...</div>
    </div>

    <div id="flipbook"></div>
  </div>

  <script>
    // Langsung panggil book.pdf tanpa folder
    const PDF_URL = 'book.pdf';

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pageFlipInstance = null;
    let pdfDoc = null;
    const renderedPages = new Set();

    async function loadPDFBook() {
      const loadingBox = document.getElementById('loading-box');
      const container = document.getElementById('flipbook');
      const loadingStatus = document.getElementById('loading-status');

      try {
        loadingStatus.innerText = 'Membaca file book.pdf...';
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
        const totalPages = pdfDoc.numPages;

        // 1. Buat kontainer div kosong (placeholder) per halaman
        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          const pageDiv = document.createElement('div');
          pageDiv.className = 'page-wrapper';
          pageDiv.dataset.pageNum = pageNum;
          
          pageDiv.innerHTML = `
            <div class="page-loader">
              <div class="page-spinner"></div>
              <span>Memuat Halaman ${pageNum}...</span>
            </div>
          `;
          container.appendChild(pageDiv);
        }

        // 2. Inisialisasi Flipbook secara cepat
        pageFlipInstance = new St.PageFlip(container, {
          width: 450,
          height: 600,
          size: "fixed",
          minWidth: 300,
          maxWidth: 900,
          minHeight: 400,
          maxHeight: 1200,
          maxShadowOpacity: 0.5,
          showCover: true,
          mobileScrollSupport: false
        });

        pageFlipInstance.loadFromHTML(document.querySelectorAll('.page-wrapper'));
        document.getElementById('page-counter').innerText = `1 / ${totalPages}`;

        // 3. Langsung render Halaman 1 & 2 di awal
        await renderSinglePage(1);
        if (totalPages > 1) await renderSinglePage(2);

        loadingBox.style.display = 'none';

        // 4. Render otomatis halaman aktif + halaman sekitarnya saat dibalik
        pageFlipInstance.on('flip', (e) => {
          const currentPage = e.data + 1;
          document.getElementById('page-counter').innerText = `${currentPage} / ${totalPages}`;

          const pagesToRender = [currentPage - 1, currentPage, currentPage + 1, currentPage + 2];
          for (const p of pagesToRender) {
            if (p >= 1 && p <= totalPages) {
              renderSinglePage(p);
            }
          }
        });

      } catch (error) {
        loadingStatus.innerText = "Gagal memuat PDF! Pastikan file 'book.pdf' ada di folder yang sama.";
        console.error(error);
      }
    }

    // Render halaman PDF ke PNG secara individual
    async function renderSinglePage(pageNum) {
      if (renderedPages.has(pageNum)) return;
      renderedPages.add(pageNum);

      try {
        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: 1.3 });
        
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: context, viewport: viewport }).promise;

        const imgUrl = canvas.toDataURL('image/png');
        const pageWrappers = document.querySelectorAll('.page-wrapper');
        const targetWrapper = pageWrappers[pageNum - 1];

        if (targetWrapper) {
          targetWrapper.innerHTML = `<img src="${imgUrl}" alt="Halaman ${pageNum}">`;
        }

        // Clean-up canvas
        canvas.width = 0;
        canvas.height = 0;

      } catch (err) {
        console.error(`Gagal render halaman ${pageNum}:`, err);
      }
    }

    window.addEventListener('DOMContentLoaded', loadPDFBook);

    document.getElementById('prev-page-btn').addEventListener('click', () => {
      if (pageFlipInstance) pageFlipInstance.flipPrev();
    });

    document.getElementById('next-page-btn').addEventListener('click', () => {
      if (pageFlipInstance) pageFlipInstance.flipNext();
    });
  </script>
</body>
</html>
