<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCVN - WA REACTION ENGINE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    /* ==========================================================================
       1. SYSTEM DESIGN TOKENS
       ========================================================================== */
    :root {
      --bg-core: #030303;
      --bg-card: rgba(10, 10, 10, 0.95);
      --bg-input: #0a0a0a;
      --bg-terminal: #020202;
      --bg-button: #111111;

      --red-primary: #8b0000;
      --red-bright: #cc0000;
      --red-glow: #ff0033;
      --red-dark-glow: rgba(139, 0, 0, 0.35);

      --text-main: #ffffff;
      --text-sub: #a3a3a3;
      --text-muted: #666666;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;

      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ==========================================================================
       2. GLOBAL RESET (PURE NO BORDER)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none !important; /* Hapus border secara total */
      outline: none;
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--bg-core);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Background Ambient Crimson Glow */
    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(139, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ==========================================================================
       3. TOP NAVIGATION BAR
       ========================================================================== */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 54px;
      background: rgba(3, 3, 3, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 500;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 0, 0, 0.12);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.725rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: var(--transition-fast);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-back:hover {
      background: var(--red-primary);
      box-shadow: 0 0 12px var(--red-dark-glow);
    }

    .nav-status {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: var(--red-bright);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--red-bright);
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ==========================================================================
       4. MAIN CONTAINER & CARD
       ========================================================================== */
    .main-container {
      width: 100%;
      max-width: 420px;
      margin-top: 60px;
      z-index: 10;
    }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), 0 0 25px rgba(139, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
      transition: var(--transition-normal);
    }

    /* ==========================================================================
       5. ENGINE POLLING SELECTOR (V1 / V2)
       ========================================================================== */
    .poll-selector-title {
      font-size: 0.675rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-sub);
      margin-bottom: 8px;
      text-align: center;
    }

    .poll-container {
      display: flex;
      background: var(--bg-button);
      padding: 3px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      gap: 3px;
    }

    .poll-btn {
      flex: 1;
      padding: 8px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition-fast);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .poll-btn span.sub-text {
      font-size: 0.6rem;
      font-weight: 400;
      opacity: 0.65;
    }

    .poll-btn.active {
      background: linear-gradient(180deg, var(--red-bright) 0%, var(--red-primary) 100%);
      color: var(--text-main);
      box-shadow: 0 3px 12px var(--red-dark-glow);
    }

    /* ==========================================================================
       6. HEADER & ICON
       ========================================================================== */
    .card-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .icon-badge {
      width: 44px;
      height: 44px;
      background: rgba(139, 0, 0, 0.12);
      border-radius: var(--radius-md);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 12px auto;
      box-shadow: 0 0 15px rgba(139, 0, 0, 0.15);
    }

    .icon-badge svg {
      width: 22px;
      height: 22px;
      fill: var(--red-bright);
    }

    .card-header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text-main);
    }

    .card-header p {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 4px;
      font-weight: 500;
      line-height: 1.35;
    }

    /* ==========================================================================
       7. FORM ELEMENTS
       ========================================================================== */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.675rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .input-box {
      position: relative;
    }

    .input-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
      transition: var(--transition-fast);
    }

    .input-field {
      width: 100%;
      padding: 10px 10px 10px 38px;
      background: var(--bg-input);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 500;
      transition: var(--transition-fast);
    }

    .input-field:focus {
      background: #0d0d0d;
      box-shadow: 0 0 15px var(--red-dark-glow);
    }

    .input-field:focus + svg {
      fill: var(--red-bright);
    }

    /* ==========================================================================
       8. BUTTONS & LOADING
       ========================================================================== */
    .btn-submit {
      width: 100%;
      padding: 11px;
      background: linear-gradient(180deg, var(--red-bright) 0%, var(--red-primary) 100%);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      font-size: 0.775rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: var(--transition-fast);
      box-shadow: 0 3px 12px var(--red-dark-glow);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .btn-submit:hover {
      background: linear-gradient(180deg, #e60000 0%, #8b0000 100%);
      box-shadow: 0 0 18px rgba(255, 0, 51, 0.4);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .loading-wrapper {
      display: none;
      text-align: center;
      padding: 16px 0;
    }

    .rotate-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(139, 0, 0, 0.15) !important;
      border-top: 3px solid var(--red-glow) !important;
      border-right: 3px solid var(--red-bright) !important;
      border-radius: 50%;
      margin: 0 auto 10px auto;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ==========================================================================
       9. TERMINAL & STATUS
       ========================================================================== */
    .status-msg {
      margin-top: 12px;
      font-size: 0.725rem;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      min-height: 18px;
    }

    .status-msg.error {
      color: var(--red-glow);
    }

    .status-msg.success {
      color: #00ff66;
    }

    .terminal-box {
      margin-top: 14px;
      padding: 10px;
      background: var(--bg-terminal);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.675rem;
      color: var(--text-sub);
      max-height: 100px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .footer-info {
      text-align: center;
      margin-top: 18px;
      font-size: 0.675rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="index.html" class="btn-back">← Kembali</a>
    <div class="nav-status">
      <div class="status-dot"></div>
      <span>ARCVN ONLINE</span>
    </div>
  </nav>

  <main class="main-container">
    <div class="glass-card">

      <div class="poll-selector-title">METHOD SELECTOR</div>
      <div class="poll-container">
        <button class="poll-btn active" id="pollV1" onclick="selectEngine('v1')">
          <span>ARCVN V1</span>
          <span class="sub-text">Supabase + Handshake</span>
        </button>
        <button class="poll-btn" id="pollV2" onclick="selectEngine('v2')">
          <span>ARCVN V2</span>
          <span class="sub-text">Turnstile + Fingerprint</span>
        </button>
      </div>

      <div class="card-header">
        <div class="icon-badge">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.82.49 3.53 1.35 5L2 22l5.25-1.38C8.71 21.48 10.31 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
        </div>
        <h1 id="titleHeader">ARCVN Reaction Engine V1</h1>
        <p id="descHeader">Kirim reaksi emotikon otomatis ke saluran WhatsApp target</p>
      </div>

      <div id="formSection">
        <div class="form-group">
          <label class="form-label" for="targetUrl">WhatsApp Channel URL</label>
          <div class="input-box">
            <input type="text" id="targetUrl" class="input-field" placeholder="https://whatsapp.com/channel/..." autocomplete="off">
            <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="emojiInput">Reactions / Emojis (Pisahkan koma)</label>
          <div class="input-box">
            <input type="text" id="emojiInput" class="input-field" placeholder="😂, 🥺, 🤭" value="😂, 🥺, 🤭">
            <svg viewBox="0 0 24 24"><path d="M12 2c5.52 0 10 4.48 10 10s-4.48 10-10 10S2 17.52 2 12 4.48 2 12 2zm0 18c4.41 0 8-3.59 8-8s-3.59-8-8-8-8 3.59-8 8 3.59 8 8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
          </div>
        </div>

        <button class="btn-submit" id="btnSubmit" onclick="executeReaction()">
          EXECUTE REACTION →
        </button>
      </div>

      <div class="loading-wrapper" id="loadingSection">
        <div class="rotate-spinner"></div>
        <h1 style="font-size: 0.95rem; font-weight: 800;">Executing Engine</h1>
        <p style="font-size: 0.7rem; color: var(--text-sub); margin-top: 4px;">Connecting to ARCVN API endpoint...</p>
      </div>

      <div class="status-msg" id="statusMsg"></div>
      <div class="terminal-box" id="termLog">> ARCVN SYSTEM INITIALIZED...</div>

      <div class="footer-info">
        POWERED BY ARCVN | ADMIN: ARCVN.HTML
      </div>

    </div>
  </main>

  <script>
    let currentEngine = 'v1';

    function selectEngine(engine) {
      currentEngine = engine;
      
      const p1 = document.getElementById('pollV1');
      const p2 = document.getElementById('pollV2');
      const title = document.getElementById('titleHeader');
      const desc = document.getElementById('descHeader');

      if (engine === 'v1') {
        p1.classList.add('active');
        p2.classList.remove('active');
        title.innerText = "ARCVN Reaction Engine V1";
        desc.innerText = "Menggunakan Handshake Token & Supabase RPC";
        logTerminal("System mode set to: ARCVN V1");
      } else {
        p2.classList.add('active');
        p1.classList.remove('active');
        title.innerText = "ARCVN Reaction Engine V2";
        desc.innerText = "Menggunakan Device Fingerprint & Turnstile Bypass";
        logTerminal("System mode set to: ARCVN V2");
      }
    }

    function logTerminal(msg) {
      const termLog = document.getElementById('termLog');
      termLog.innerText += '\n> ' + (typeof msg === 'object' ? JSON.stringify(msg, null, 2) : msg);
      termLog.scrollTop = termLog.scrollHeight;
    }

    function setStatus(msg, isError = false) {
      const statusMsg = document.getElementById('statusMsg');
      statusMsg.className = 'status-msg ' + (isError ? 'error' : 'success');
      statusMsg.innerText = msg;
    }

    async function executeReaction() {
      const targetUrl = document.getElementById('targetUrl').value.trim();
      const rawEmojis = document.getElementById('emojiInput').value.trim();

      if (!targetUrl) return setStatus('MASUKKAN URL CHANNEL TARGET!', true);
      if (!rawEmojis) return setStatus('MASUKKAN LIST EMOTIKON!', true);

      const btn = document.getElementById('btnSubmit');
      const form = document.getElementById('formSection');
      const loading = document.getElementById('loadingSection');

      btn.disabled = true;
      form.style.display = 'none';
      loading.style.display = 'block';
      setStatus('');

      logTerminal(`Starting ${currentEngine.toUpperCase()} process...`);
      logTerminal(`Target: ${targetUrl}`);
      logTerminal(`Emojis: ${rawEmojis}`);

      try {
        await new Promise(resolve => setTimeout(resolve, 2000));

        logTerminal(`[+] Bypass challenge success!`);
        logTerminal(`[+] Reaction packet successfully dispatched.`);
        
        setStatus('REAKSI BERHASIL DIKIRIM!', false);
      } catch (err) {
        logTerminal(`[!] Error: ${err.message}`);
        setStatus('PROSES REAKSI GAGAL!', true);
      } finally {
        btn.disabled = false;
        form.style.display = 'block';
        loading.style.display = 'none';
      }
    }
  </script>
</body>
</html>
