<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cacing Nokia HD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0d1b12;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            background-color: #12261a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1b3826;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #2e5e3f;
        }
        .back-btn {
            color: #4ade80;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .title {
            font-size: 15px;
            font-weight: bold;
            color: #a7f3d0;
        }
        .score-board {
            display: flex;
            justify-content: space-around;
            background-color: #183322;
            padding: 6px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #275238;
        }
        .score-board span {
            color: #fde047;
        }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0b1710;
            border-radius: 8px;
            border: 2px solid #2e5e3f;
            overflow: hidden;
            margin: 6px 0;
        }
        canvas {
            background-color: #4ade80;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            touch-action: none;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 23, 16, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        .overlay h2 {
            font-size: 22px;
            color: #f87171;
            margin-bottom: 8px;
        }
        .overlay p {
            font-size: 13px;
            color: #d1d5db;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .btn-action {
            background-color: #16a34a;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .controls-section {
            background-color: #183322;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #275238;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .speed-control {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .speed-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a7f3d0;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #22c55e;
            height: 6px;
            background: #0b1710;
            border-radius: 3px;
            outline: none;
        }
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(2, 45px);
            gap: 6px;
            justify-content: center;
            margin: 4px auto 0 auto;
        }
        .dpad-btn {
            background-color: #275238;
            color: #ffffff;
            border: 1px solid #3b7a52;
            font-size: 16px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
        }
        .dpad-btn:active {
            background-color: #1b3826;
        }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <a href="/game.html" class="back-btn">&larr; Kembali</a>
        <div class="title">Cacing Nokia HD</div>
    </div>

    <!-- Skor -->
    <div class="score-board">
        <div>Skor: <span id="current-score">0</span></div>
        <div>Tertinggi: <span id="high-score">0</span></div>
    </div>

    <!-- Canvas Area -->
    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="320" height="426"></canvas>
        
        <!-- Overlay Game Over / Start -->
        <div id="gameOverlay" class="overlay">
            <h2 id="overlayTitle">Cacing Nokia HD</h2>
            <p id="overlayDesc">Gunakan D-Pad di bawah atau geser layar untuk mengarahkan cacing.</p>
            <button class="btn-action" id="startBtn" onclick="startGame()">Mulai Main</button>
        </div>
    </div>

    <!-- Kontrol -->
    <div class="controls-section">
        <div class="speed-control">
            <div class="speed-label">
                <span>Kecepatan Cacing</span>
                <span id="speedText">Normal</span>
            </div>
            <input type="range" id="speedSlider" min="1" max="5" value="3" oninput="changeSpeed(this.value)">
        </div>

        <!-- D-Pad Controller Presisi -->
        <div class="dpad">
            <button class="dpad-btn btn-up" onclick="setDir('UP')">&#9650;</button>
            <button class="dpad-btn btn-left" onclick="setDir('LEFT')">&#9664;</button>
            <button class="dpad-btn btn-down" onclick="setDir('DOWN')">&#9660;</button>
            <button class="dpad-btn btn-right" onclick="setDir('RIGHT')">&#9654;</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const tileSize = 16;
    const tileCountX = 20; // 20 * 16 = 320
    const tileCountY = 26; // 26 * 16 = 416 (Proporsi 9:16 Portrait)
    
    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let highScore = localStorage.getItem('cacing_high_score') || 0;
    let gameInterval = null;
    let gameRunning = false;
    let gameSpeed = 110;

    document.getElementById('high-score').innerText = highScore;

    function changeSpeed(val) {
        const speeds = [180, 140, 110, 80, 50];
        const names = ['Sangat Pelan', 'Pelan', 'Normal', 'Cepat', 'Ngebut'];
        gameSpeed = speeds[val - 1];
        document.getElementById('speedText').innerText = names[val - 1];
        
        if (gameRunning) {
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }
    }

    function startGame() {
        snake = [
            { x: 10, y: 13 },
            { x: 9, y: 13 },
            { x: 8, y: 13 }
        ];
        dx = 1;
        dy = 0;
        nextDx = 1;
        nextDy = 0;
        score = 0;
        document.getElementById('current-score').innerText = score;
        document.getElementById('gameOverlay').style.display = 'none';
        
        spawnFood();
        gameRunning = true;
        
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, gameSpeed);
    }

    function spawnFood() {
        food.x = Math.floor(Math.random() * tileCountX);
        food.y = Math.floor(Math.random() * tileCountY);
        for (let part of snake) {
            if (part.x === food.x && part.y === food.y) {
                spawnFood();
                break;
            }
        }
    }

    function setDir(direction) {
        if (!gameRunning) return;
        if (direction === 'UP' && dy === 0) { nextDx = 0; nextDy = -1; }
        if (direction === 'DOWN' && dy === 0) { nextDx = 0; nextDy = 1; }
        if (direction === 'LEFT' && dx === 0) { nextDx = -1; nextDy = 0; }
        if (direction === 'RIGHT' && dx === 0) { nextDx = 1; nextDy = 0; }
    }

    // Keyboard support
    window.addEventListener('keydown', e => {
        if (['ArrowUp', 'KeyW'].includes(e.code)) setDir('UP');
        if (['ArrowDown', 'KeyS'].includes(e.code)) setDir('DOWN');
        if (['ArrowLeft', 'KeyA'].includes(e.code)) setDir('LEFT');
        if (['ArrowRight', 'KeyD'].includes(e.code)) setDir('RIGHT');
    });

    // Touch Swipe Support
    let touchStartX = 0;
    let touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchend', e => {
        if (!gameRunning) return;
        let diffX = e.changedTouches[0].clientX - touchStartX;
        let diffY = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(diffX) > Math.abs(diffY)) {
            if (diffX > 20) setDir('RIGHT');
            else if (diffX < -20) setDir('LEFT');
        } else {
            if (diffY > 20) setDir('DOWN');
            else if (diffY < -20) setDir('UP');
        }
    });

    function gameLoop() {
        dx = nextDx;
        dy = nextDy;
        
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        if (head.x < 0 || head.x >= tileCountX || head.y < 0 || head.y >= tileCountY) {
            gameOver();
            return;
        }

        for (let part of snake) {
            if (head.x === part.x && head.y === part.y) {
                gameOver();
                return;
            }
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            document.getElementById('current-score').innerText = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('cacing_high_score', highScore);
                document.getElementById('high-score').innerText = highScore;
            }
            spawnFood();
        } else {
            snake.pop();
        }

        draw();
    }

    function gameOver() {
        gameRunning = false;
        clearInterval(gameInterval);
        document.getElementById('overlayTitle').innerText = "Game Over!";
        document.getElementById('overlayDesc').innerText = `Skor Akhir Kamu: ${score}\nCoba lagi untuk kalahkan rekor!`;
        document.getElementById('startBtn').innerText = "Main Lagi";
        document.getElementById('gameOverlay').style.display = 'flex';
    }

    function draw() {
        // Background Rumput Checkerboard Natural
        for (let r = 0; r < tileCountY; r++) {
            for (let c = 0; c < tileCountX; c++) {
                ctx.fillStyle = (r + c) % 2 === 0 ? '#4ade80' : '#22c55e';
                ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
            }
        }

        // Apel HD Natural
        let ax = food.x * tileSize + tileSize / 2;
        let ay = food.y * tileSize + tileSize / 2;
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.arc(ax, ay + 1, tileSize / 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(ax, ay - 3);
        ctx.lineTo(ax + 2, ay - 7);
        ctx.stroke();
        ctx.fillStyle = '#15803d';
        ctx.fillRect(ax + 2, ay - 8, 4, 3);

        // Badan Cacing HD
        snake.forEach((part, index) => {
            let px = part.x * tileSize;
            let py = part.y * tileSize;
            
            ctx.fillStyle = index === 0 ? '#14532d' : '#166534';
            ctx.beginPath();
            ctx.roundRect(px + 1, py + 1, tileSize - 2, tileSize - 2, 5);
            ctx.fill();

            if (index === 0) {
                ctx.fillStyle = '#ffffff';
                let eye1x = px + 4, eye1y = py + 4;
                let eye2x = px + 10, eye2y = py + 4;
                if (dx === 1) { eye1x = px + 10; eye1y = py + 4; eye2x = px + 10; eye2y = py + 10; }
                else if (dx === -1) { eye1x = px + 4; eye1y = py + 4; eye2x = px + 4; eye2y = py + 10; }
                else if (dy === 1) { eye1x = px + 4; eye1y = py + 10; eye2x = px + 10; eye2y = py + 10; }
                
                ctx.fillRect(eye1x, eye1y, 3, 3);
                ctx.fillRect(eye2x, eye2y, 3, 3);
            }
        });
    }

    draw();
</script>

</body>
</html>
