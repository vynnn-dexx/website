<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VynnStream - Anime Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --bg: #000000;
      --card-bg: #111111;
      --border: #222222;
      --text: #ffffff;
      --muted: #888888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg); 
      color: var(--text); 
      padding-bottom: 40px; 
    }

    header {
      background: #000000;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #111111;
      color: var(--text);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
    }

    .logo { 
      font-size: 1rem; 
      font-weight: 800; 
      letter-spacing: 1px;
      color: var(--text); 
    }

    .search-box { 
      display: flex; 
      gap: 8px; 
      width: 100%; 
    }
    .search-box input { 
      flex: 1; 
      padding: 10px 14px; 
      border-radius: 6px; 
      border: 1px solid var(--border); 
      background: var(--card-bg); 
      color: #fff; 
      font-size: 14px; 
      outline: none; 
    }
    .search-box input:focus { border-color: #fff; }
    .search-box button { 
      padding: 10px 16px; 
      border-radius: 6px; 
      border: 1px solid #fff; 
      background: #fff; 
      color: #000; 
      font-weight: bold; 
      cursor: pointer; 
    }

    .container { max-width: 1000px; margin: 16px auto; padding: 0 16px; }

    /* Video Player Box */
    .player-section { margin-bottom: 24px; display: none; }
    .player-box { 
      position: relative; 
      padding-top: 56.25%; 
      background: #000; 
      border-radius: 8px; 
      overflow: hidden; 
      border: 1px solid var(--border); 
    }
    .player-box video, .player-box iframe { 
      position: absolute; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      border: none; 
    }

    .player-details { 
      background: var(--card-bg); 
      padding: 14px; 
      border-radius: 8px; 
      margin-top: 10px; 
      border: 1px solid var(--border); 
    }
    .player-details h2 { font-size: 1.1rem; color: #fff; }

    /* Grid Layout */
    .section-title { 
      font-size: 0.95rem; 
      font-weight: 700; 
      margin: 16px 0 12px 0; 
      color: var(--text); 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 12px; 
    }

    @media (min-width: 600px) {
      header { flex-direction: row; }
      .search-box { width: 320px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    }

    .card { 
      background: var(--card-bg); 
      border-radius: 8px; 
      overflow: hidden; 
      border: 1px solid var(--border); 
      cursor: pointer; 
    }
    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 180px;
    }
    .card-img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }
    .play-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-overlay i {
      font-size: 2rem;
      color: #ffffff;
    }

    .card-body { padding: 8px; }
    .card-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }

    .status-msg { text-align: center; padding: 30px; color: var(--muted); font-size: 14px; grid-column: 1/-1; }
  </style>
</head>
<body>

  <header>
    <div class="nav-top">
      <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Home</a>
      <div class="logo">VYNN.ANIME</div>
    </div>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Cari anime..." />
      <button onclick="searchAnime()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </header>

  <div class="container">
    
    <div class="player-section" id="playerSection">
      <div class="player-box">
        <video id="videoPlayer" controls></video>
        <iframe id="iframePlayer" style="display:none;" allowfullscreen></iframe>
      </div>
      <div class="player-details">
        <h2 id="animeTitle">Judul Anime</h2>
        <p id="animeEp" style="color: var(--muted); font-size: 13px; margin-top: 4px;"></p>
      </div>
    </div>

    <div class="section-title" id="gridTitle">Popular Anime</div>
    <div class="grid" id="animeGrid">
      <div class="status-msg" id="statusMsg"><i class="fa-solid fa-spinner fa-spin"></i> Memuat data...</div>
    </div>

  </div>

  <script>
    const API_URL = 'https://aniwatch-api-fork-vynn.vercel.app';

    const grid = document.getElementById('animeGrid');
    const gridTitle = document.getElementById('gridTitle');
    const playerSection = document.getElementById('playerSection');
    const videoPlayer = document.getElementById('videoPlayer');
    const iframePlayer = document.getElementById('iframePlayer');
    const animeTitle = document.getElementById('animeTitle');
    const animeEp = document.getElementById('animeEp');

    let hls = new Hls();

    window.addEventListener('DOMContentLoaded', fetchHomeData);

    async function apiFetch(endpoint) {
      const res = await fetch(`${API_URL}${endpoint}`);
      if (!res.ok) throw new Error('API Request Failed');
      return await res.json();
    }

    async function fetchHomeData() {
      showStatus('<i class="fa-solid fa-spinner fa-spin"></i> Memuat data...');
      try {
        const data = await apiFetch('/api/parse');
        const list = data.slides || data.trend || [];
        if (list.length > 0) {
          renderGrid(list);
        } else {
          executeSearch('naruto');
        }
      } catch (err) {
        console.error(err);
        executeSearch('naruto');
      }
    }

    function searchAnime() {
      const query = document.getElementById('searchInput').value.trim();
      if (query) executeSearch(query);
    }

    async function executeSearch(query) {
      gridTitle.innerText = `HASIL: "${query.toUpperCase()}"`;
      showStatus('<i class="fa-solid fa-spinner fa-spin"></i> Mencari...');

      try {
        // Encode kata kunci dengan benar untuk endpoint /api/search/:query/1
        const cleanQuery = encodeURIComponent(query);
        const data = await apiFetch(`/api/search/${cleanQuery}/1`);
        const list = data.searchYour || data.results || data.animes || [];

        if (list && list.length > 0) {
          renderGrid(list);
        } else {
          showStatus('Anime tidak ditemukan.');
        }
      } catch (err) {
        console.error(err);
        showStatus('Gagal memuat data dari server.');
      }
    }

    function renderGrid(list) {
      grid.innerHTML = '';
      list.forEach(item => {
        const id = item.animeId || item.idanime || item.id || '';
        const title = item.name || item.title || 'Untitled';
        const img = item.imageAnime || item.imgAni || item.img || item.poster || '';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-img-wrapper">
            <img class="card-img" src="${img}" alt="${title}" loading="lazy" />
            <div class="play-overlay">
              <i class="fa-solid fa-circle-play"></i>
            </div>
          </div>
          <div class="card-body">
            <div class="card-title" title="${title}">${title}</div>
          </div>
        `;

        card.onclick = () => playStream(id, title);
        grid.appendChild(card);
      });
    }

    async function playStream(animeId, title) {
      if (!animeId) return;

      showStatus('<i class="fa-solid fa-spinner fa-spin"></i> Memuat video...');
      try {
        const streamData = await apiFetch(`/api/src1?id=${animeId}-episode-1`);
        
        playerSection.style.display = 'block';
        animeTitle.innerText = title;
        animeEp.innerText = 'Episode 1';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        const streamUrl = streamData.link || (streamData.sources && streamData.sources[0]?.file);

        if (streamUrl) {
          if (streamUrl.includes('.m3u8')) {
            iframePlayer.style.display = 'none';
            videoPlayer.style.display = 'block';

            if (Hls.isSupported()) {
              hls.destroy();
              hls = new Hls();
              hls.loadSource(streamUrl);
              hls.attachMedia(videoPlayer);
              hls.on(Hls.Events.MANIFEST_PARSED, () => videoPlayer.play());
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
              videoPlayer.src = streamUrl;
              videoPlayer.play();
            }
          } else {
            videoPlayer.style.display = 'none';
            iframePlayer.style.display = 'block';
            iframePlayer.src = streamUrl;
          }
        } else {
          alert('Link stream tidak ditemukan.');
        }
      } catch (err) {
        console.error(err);
        alert('Gagal memuat stream video.');
      } finally {
        const msg = grid.querySelector('.status-msg');
        if (msg) msg.remove();
      }
    }

    function showStatus(htmlContent) {
      grid.innerHTML = `<div class="status-msg">${htmlContent}</div>`;
    }
  </script>
</body>
</html>
